name: Upload to Steam Workshop

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Workshop item ID to update (0 = create a new item)'
        required: true
        default: '0'
      visibility:
        description: 'Item visibility'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - friends
          - private
          - unlisted

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PolitiCities
          path: dist

      - name: Stage workshop content
        run: |
          mkdir -p workshop
          cd dist
          unzip -o PolitiCities.zip -d ../workshop/

      - name: Write workshop descriptor
        run: |
          case "${{ inputs.visibility }}" in
            public) vis=0 ;;
            friends) vis=1 ;;
            private) vis=2 ;;
            unlisted) vis=3 ;;
          esac
          preview=""
          if [ -f workshop/PolitiCities/PreviewImage.png ]; then
            preview="\"previewfile\" \"$GITHUB_WORKSPACE/workshop/PolitiCities/PreviewImage.png\""
          fi
          cat > workshop/workshop_build_item.txt <<EOF
          "workshopitem"
          {
            "appid" "255710"
            "publishedfileid" "${{ inputs.item_id }}"
            "contentroot" "$GITHUB_WORKSPACE/workshop/PolitiCities"
            $preview
            "title" "PolitiCities"
            "description" "Adds more politics to your Cities Skylines city. Requires the CitiesHarmony mod (workshop item 2040656402)."
            "visibility" "$vis"
            "tags"
            {
              "0" "Mod"
            }
          }
          EOF

      - uses: RageAgainstThePixel/setup-steamcmd@v1

      - name: Upload
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_GUARD: ${{ secrets.STEAM_GUARD }}
        run: |
          args=(+login "$STEAM_USERNAME" "$STEAM_PASSWORD")
          if [ -n "$STEAM_GUARD" ]; then
            args+=("$STEAM_GUARD")
          fi
          steamcmd "${args[@]}" +workshop_build_item "$GITHUB_WORKSPACE/workshop/workshop_build_item.txt" +quit
